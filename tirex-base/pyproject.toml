[project]
name = "tirex-base"
version = "2.0.0"
description = "TiRex-2 baseline: daily electricity forecast with all 100 covariates, with accuracy and compute reports."
requires-python = ">=3.11"
dependencies = ["torch==2.14.0", "tirex-2==0.3.0", "numpy>=2.0", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
